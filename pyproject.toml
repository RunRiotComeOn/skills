[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmap"
version = "0.0.1"
description = "Training-free per-user procedural memory for LLM assistants"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skillmap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
