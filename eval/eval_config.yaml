# All eval hyperparameters. Model IDs refer to Bedrock Converse model ids
# (see skillmap/llm/client.py for the supported catalog).

llm:
  # User simulator (LLM-A). Strong model, deterministic.
  llm_a_model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  # Assistant under test (LLM-B). Different family/size recommended.
  llm_b_model: minimax.minimax-m2.5
  # Preference-recovery judge (can share with A).
  llm_judge_model: us.anthropic.claude-haiku-4-5-20251001-v1:0

  temperature_a: 0.0
  temperature_b: 0.7
  max_tokens: 4096
  region: us-east-1

  # Cheap dev-time overrides for smoke tests. Set to null to use the models above.
  # dev_override_a: minimax.minimax-m2.5
  # dev_override_b: minimax.minimax-m2.5
  # dev_override_judge: minimax.minimax-m2.5

preferences:
  n_preferences: 10
  retry_max: 3

tasks:
  # Supported: livecodebench | aime
  # For aime, set cache_dir to ./data/aime and place raw JSONL files there,
  # or leave it empty to auto-download from HuggingFace (AI-MO/aimo-validation-aime).
  source: livecodebench
  cache_dir: ./data/livecodebench
  n_stream: 30
  n_held_out: 10
  difficulty_mix:
    easy: 0.4
    medium: 0.4
    hard: 0.2
  seed: 42

interaction:
  max_turns_per_task: 8
  give_up_threshold_repeats: 3

conditions:
  - stateless
  - declarative_memory
  - skillmap

sanity_check:
  timeout_per_test_seconds: 10
  skip_on_extraction_failure: true

paths:
  profiles_dir: ./skillmap_eval/preferences/profiles
  results_dir: ./results
  logs_dir: ./results/logs
